[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isp-radius-enterprise"
version = "2.0.0.dev0"
description = "Vendor-neutral ISP AAA and network operations platform"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=46.0",
    "webauthn>=3.0.1,<4",
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pyrad>=2.5.4,<3",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
aws-kms = ["boto3>=1.35"]

[project.scripts]
isp-radius-set-password = "isp_radius.cli.provision_subscriber:main"
isp-radius-command-worker = "isp_radius.worker.command_dispatcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
"isp_radius.aaa" = ["radius_dictionary"]
