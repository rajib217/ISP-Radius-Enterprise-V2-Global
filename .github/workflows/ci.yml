name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isp_radius
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: isp_radius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isp_radius -d isp_radius_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://isp_radius:test_password@localhost:5432/isp_radius_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit and PostgreSQL integration tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
